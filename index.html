<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> 
    <title>TORNADO AI</title> 
    <style> 
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* ---------------------------------------------------
           ORIGINAL BACKGROUND & GLOBALS (SCROLL DISABLED & FIXED HEIGHT)
           --------------------------------------------------- */
        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* সম্পূর্ণ আপ-ডাউন স্ক্রলিং বন্ধ */
        }

        body { 
            background-color: #0b1120; 
            background-image: 
                linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px),
                radial-gradient(circle at 15% 50%, rgba(37, 99, 235, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(56, 189, 248, 0.15) 0%, transparent 50%);
            background-size: 30px 30px, 30px 30px, 100% 100%, 100% 100%;
            background-attachment: fixed;
            color: #e2e8f0; 
            font-family: 'Consolas', 'Courier New', monospace;
            text-align: center; 
            padding: 10px 12px;
            margin: 0;
            letter-spacing: 0.5px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        } 

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?q=80&w=2070&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            opacity: 0.18; 
            z-index: -1;
            pointer-events: none;
            mix-blend-mode: luminosity;
        }

        /* 1. LICENSE SCREEN */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            z-index: 100;
            position: relative;
        }

        .login-box {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid #38bdf8;
            border-radius: 16px;
            padding: 30px 35px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.25);
        }

        .login-box svg.lock-icon {
            width: 48px;
            height: 48px;
            stroke: #38bdf8;
            margin-bottom: 15px;
        }

        .login-box h2 {
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 20px;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid #334155;
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            font-family: inherit;
            text-align: center;
            letter-spacing: 2px;
        }

        .input-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            background: rgba(15, 23, 42, 1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #2563eb, #38bdf8);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            font-family: inherit;
        }

        .login-btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
        }

        /* NOTICE MODAL */
        #notice-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 17, 32, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .notice-box {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.98), rgba(30, 41, 59, 0.98));
            border: 1px solid #38bdf8;
            border-radius: 16px;
            padding: 30px 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.3);
            position: relative;
            text-align: center;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: #ef4444;
            cursor: pointer;
            padding: 6px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            transform: scale(1.1);
        }

        .close-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .notice-title {
            color: #38bdf8;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 10px 0 20px 0;
            text-transform: uppercase;
        }

        .notice-content {
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.6;
            text-align: left;
            margin-bottom: 10px;
        }

        .notice-content p {
            margin-bottom: 12px;
        }

        .notice-content strong {
            color: #ffffff;
        }

        /* 2. MAIN APPLICATION CONTAINER - DESKTOP SIZE */
        #main-app {
            display: none;
            width: 100%;
            max-width: 1000px;
            height: 100vh;
            margin: 0 auto;
            flex-direction: column;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .animated-box { 
            display: inline-block; 
            padding: 12px 20px; 
            border-radius: 12px; 
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25); 
            position: relative; 
            overflow: hidden; 
            animation: glowPulse 3s ease-in-out infinite; 
            margin-bottom: 12px; 
            width: 100%;
            flex-shrink: 0;
        } 
        
        .animated-box::before { 
            content: ''; position: absolute; top: -50%; left: -50%; 
            width: 200%; height: 200%; 
            background: conic-gradient(from 0deg, #38bdf8, #1e40af, #0f172a, #38bdf8); 
            animation: rotate 6s linear infinite; z-index: 0; 
        } 
        
        .animated-box::after { 
            content: ''; position: absolute; top: 3px; left: 3px; right: 3px; bottom: 3px; 
            background: #0f172a; border-radius: 10px; z-index: 1; 
        } 
        
        .animated-box h1 { 
            position: relative; z-index: 2; font-size: 22px; 
            letter-spacing: 2px; margin: 0; color: #ffffff; 
            font-weight: bold;
        }

        /* TABS FOR OTC & REAL MARKETS */
        .market-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            border-radius: 8px;
            color: #94a3b8;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            transition: 0.3s;
            font-family: inherit;
            text-transform: uppercase;
        }

        .tab-btn.active {
            background: linear-gradient(45deg, #2563eb, #38bdf8);
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .market-grid-container {
            width: 100%;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 15px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            margin-bottom: 12px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* শুধুমাত্র মার্কেট গ্রিডে স্ক্রল অন করা হয়েছে */
        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 8px;
            overflow-y: auto; /* এখানে স্ক্রল অন করা হয়েছে */
            padding-right: 4px;
            flex-grow: 1;
        }

        /* কাস্টম স্ক্রলবার ডিজাইন */
        .market-grid::-webkit-scrollbar {
            width: 6px;
        }
        .market-grid::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 4px;
        }
        .market-grid::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.4);
            border-radius: 4px;
        }
        .market-grid::-webkit-scrollbar-thumb:hover {
            background: rgba(56, 189, 248, 0.8);
        }

        .market-card {
            display: block;
            cursor: pointer;
            position: relative;
        }

        .market-card input { display: none; }

        .card-content {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            color: #94a3b8;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .market-card:hover .card-content {
            border-color: #475569;
            background: linear-gradient(145deg, rgba(51, 65, 85, 0.8), rgba(30, 41, 59, 0.9));
        }

        .market-card input:checked + .card-content {
            background: linear-gradient(145deg, rgba(37, 99, 235, 0.2), rgba(15, 23, 42, 0.9));
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
            transform: translateY(-1px);
        }

        .check-icon {
            width: 16px; height: 16px; stroke: #38bdf8; fill: none;
            stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
            opacity: 0; transform: scale(0.5); transition: all 0.3s ease;
        }

        .market-card input:checked + .card-content .check-icon {
            opacity: 1; transform: scale(1);
        }
        
        #generate-btn { 
            position: relative; display: block; margin: 0 auto; 
            padding: 14px 40px; color: #ffffff; font-weight: bold;
            font-size: 16px; font-family: inherit;
            text-transform: uppercase; letter-spacing: 2px; 
            background: linear-gradient(45deg, #1e3a8a, #0369a1); 
            border: 1px solid #38bdf8; 
            border-radius: 12px; cursor: pointer; overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%; max-width: 400px; transition: 0.3s;
            flex-shrink: 0;
        } 
        
        #generate-btn:hover { 
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5); 
            transform: translateY(-2px); 
            background: linear-gradient(45deg, #1e40af, #0284c7); 
        } 

        .social-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 12px; 
            padding-top: 12px; 
            border-top: 1px solid #1e293b;
            flex-shrink: 0;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px; 
            height: 40px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid #334155;
            border-radius: 12px;
            color: #94a3b8;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .social-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .social-btn.telegram:hover {
            background: rgba(0, 136, 204, 0.1);
            border-color: #0088cc;
            color: #0088cc;
            box-shadow: 0 0 15px rgba(0, 136, 204, 0.4);
            transform: translateY(-2px);
        }

        .social-btn.tiktok:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ffffff;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .back-nav-btn {
            background: rgba(30, 41, 59, 0.9); border: 1px solid #38bdf8; color: #38bdf8;
            padding: 14px 30px; border-radius: 10px; font-size: 15px; font-weight: bold;
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 25px; transition: 0.3s; font-family: inherit;
            text-transform: uppercase; letter-spacing: 2px; width: 100%; max-width: 400px;
        }
        .back-nav-btn:hover { background: #38bdf8; color: #0f172a; box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
        
        .back-nav-btn svg {
            width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2;
        }

        /* 3. SINGLE LARGE FULL-SCREEN SIGNAL VIEW */
        #single-signal-page {
            display: none; width: 100%; max-width: 1000px; margin: 0 auto; animation: fadeIn 0.4s ease-in-out;
            height: 100vh; overflow: hidden; padding: 20px;
            flex-direction: column; justify-content: center; align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #single-signal-container { width: 100%; max-width: 500px; }

        .single-signal-box {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 35px 25px 25px 25px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            position: relative;
            width: 100%;
        }

        .single-signal-box.single-up {
            border-top: 6px solid #22c55e;
            box-shadow: 0 -10px 40px rgba(34, 197, 94, 0.15);
        }

        .single-signal-box.single-down {
            border-top: 6px solid #ef4444;
            box-shadow: 0 -10px 40px rgba(239, 68, 68, 0.15);
        }

        .single-pair-title {
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 25px;
            letter-spacing: 1.5px;
        }

        .large-logo-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px auto;
        }

        .large-logo-up {
            background: rgba(34, 197, 94, 0.1);
            border: 2px solid #22c55e;
            color: #22c55e;
        }

        .large-logo-down {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid #ef4444;
            color: #ef4444;
        }

        .large-logo-circle svg {
            width: 50px;
            height: 50px;
            stroke-width: 3;
            stroke: currentColor;
            fill: none;
        }

        .single-direction-text {
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .single-details-grid {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 20px;
        }

        .detail-item { text-align: center; }
        .detail-label {
            font-size: 13px; color: #94a3b8; text-transform: uppercase;
            margin-bottom: 8px; letter-spacing: 1px; font-weight: bold;
        }
        .detail-value {
            font-size: 18px; font-weight: bold; color: #38bdf8;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .detail-value svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

        .single-trade-rule {
            border-top: 1px solid rgba(51, 65, 85, 0.6);
            padding-top: 15px;
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
            line-height: 1.6;
        }
        .single-trade-rule span {
            color: #38bdf8;
            font-weight: bold;
        }

        @keyframes rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } 
        @keyframes glowPulse { 0%, 100% { box-shadow: 0 0 12px rgba(56, 189, 248, 0.2); } 50% { box-shadow: 0 0 24px rgba(56, 189, 248, 0.4); } } 
    </style>
</head>
<body>

    <!-- 1. LICENSE LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <h2>LICENSE REQUIRED</h2>
            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="license-key">ENTER YOUR VIP LICENSE</label>
                    <input type="password" id="license-key" required placeholder="••••••••">
                </div>
                <button type="submit" class="login-btn">VERIFY ACCESS</button>
            </form>
        </div>
    </div>

    <!-- NOTICE MODAL -->
    <div id="notice-modal">
        <div class="notice-box">
            <button class="close-btn" onclick="closeNotice()" title="Close">
                <svg viewBox="0 0 24 24">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            
            <h2 class="notice-title">Notice</h2>
            <div class="notice-content">
                <p>Welcome to <strong>TORNADO AI</strong>.</p>
                <p>Please note that <strong>OTC & Real Markets</strong> are active. Always trade carefully and follow proper money management rules.</p>
                <p>Generate signals and trade at your own risk. Best of luck!</p>
            </div>
        </div>
    </div>

    <!-- 2. MAIN APPLICATION -->
    <div id="main-app">
        <div class="animated-box">
            <div style="position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; width: 100%;">
                
                <!-- Home Icon SVG -->
                <svg viewBox="0 0 24 24" style="width: 28px; height: 28px; stroke: #38bdf8; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; cursor: pointer;">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                
                <h1>TORNADO AI</h1>
                
                <!-- 3-Dot (Menu) Icon SVG -->
                <svg viewBox="0 0 24 24" style="width: 28px; height: 28px; fill: #38bdf8; cursor: pointer;">
                    <circle cx="12" cy="5" r="2.5"></circle>
                    <circle cx="12" cy="12" r="2.5"></circle>
                    <circle cx="12" cy="19" r="2.5"></circle>
                </svg>
                
            </div>
        </div>

        <!-- MARKET TYPE TABS -->
        <div class="market-tabs">
            <button type="button" class="tab-btn active" id="tab-otc" onclick="switchMarketType('otc')">OTC Markets</button>
            <button type="button" class="tab-btn" id="tab-real" onclick="switchMarketType('real')">Real Markets</button>
        </div>

        <div class="market-grid-container">
            <div class="market-grid" id="market-list">
                <!-- Markets rendered via JS -->
            </div>
        </div>

        <button id="generate-btn" onclick="generateSignals()">Generate Signal</button>

        <!-- Social Links -->
        <div class="social-container">
            <a href="https://t.me/BinaryNetworkX" target="_blank" class="social-btn telegram" title="Join our Telegram">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .24z"/>
                </svg>
            </a>
            <a href="https://www.tiktok.com/@hyperfaheem?_r=1&_t=ZS-99BediWeRJE" target="_blank" class="social-btn tiktok" title="Follow our TikTok">
                <svg viewBox="0 0 24 24">
                    <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
                </svg>
            </a>
        </div>
    </div>

    <!-- 3. SINGLE SIGNAL PAGE -->
    <div id="single-signal-page">
        <div id="single-signal-container"></div>
        <button class="back-nav-btn" onclick="goBack()">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
            AGAIN ANALYZE
        </button>
    </div>

    <!-- SVG Definitions -->
    <svg style="display: none;">
        <symbol id="icon-up" viewBox="0 0 24 24">
            <polyline points="18 15 12 9 6 15"></polyline>
        </symbol>
        <symbol id="icon-down" viewBox="0 0 24 24">
            <polyline points="6 9 12 15 18 9"></polyline>
        </symbol>
        <symbol id="icon-clock" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
        </symbol>
    </svg>

    <script>
        // --- SESSION MANAGEMENT LOGIC ---
        window.addEventListener('DOMContentLoaded', () => {
            let isReload = false;
            
            if (window.performance) {
                if (window.performance.getEntriesByType) {
                    const navEntries = window.performance.getEntriesByType("navigation");
                    if (navEntries.length > 0 && navEntries[0].type === "reload") {
                        isReload = true;
                    }
                }
                if (!isReload && window.performance.navigation && window.performance.navigation.type === 1) {
                    isReload = true;
                }
            }

            if (isReload) {
                sessionStorage.removeItem('isLoggedIn');
            }

            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'flex';
            }
        });

        // Quotex OTC Markets Array
        const otcMarkets = [
            "EUR/USD (OTC)", "GBP/USD (OTC)", "USD/JPY (OTC)", "AUD/USD (OTC)", 
            "USD/CHF (OTC)", "USD/CAD (OTC)", "NZD/USD (OTC)", "EUR/GBP (OTC)", 
            "EUR/JPY (OTC)", "GBP/JPY (OTC)", "AUD/CAD (OTC)", "CAD/JPY (OTC)", 
            "CHF/JPY (OTC)", "AUD/JPY (OTC)", "AUD/NZD (OTC)", "AUD/CHF (OTC)",
            "CAD/CHF (OTC)", "EUR/AUD (OTC)", "EUR/CAD (OTC)", "EUR/CHF (OTC)",
            "EUR/NZD (OTC)", "GBP/AUD (OTC)", "GBP/CAD (OTC)", "GBP/CHF (OTC)",
            "GBP/NZD (OTC)", "NZD/CAD (OTC)", "NZD/CHF (OTC)", "NZD/JPY (OTC)",
            "BDT/USD (OTC)", "USD/BDT (OTC)", "INR/USD (OTC)", "USD/INR (OTC)",
            "PKR/USD (OTC)", "USD/PKR (OTC)", "EGP/USD (OTC)", "USD/EGP (OTC)",
            "DZD/USD (OTC)", "USD/DZD (OTC)", "UAH/USD (OTC)", "USD/UAH (OTC)",
            "BZF/USD (OTC)", "USD/BZF (OTC)", "USD/IDR (OTC)", "USD/MYR (OTC)",
            "USD/PHP (OTC)", "USD/THB (OTC)", "USD/VND (OTC)", "USD/TRY (OTC)",
            "USD/ZAR (OTC)", "USD/MXN (OTC)", "USD/BRL (OTC)", "USD/ARS (OTC)",
            "USD/NGN (OTC)", "USD/KES (OTC)", "USD/COP (OTC)", "USD/CLP (OTC)",
            "GOLD (OTC)", "SILVER (OTC)", "UKBRENT (OTC)", "USCRUDE (OTC)",
            "American Express (OTC)", "Apple (OTC)", "Boeing (OTC)", "Coca-Cola (OTC)",
            "Intel (OTC)", "Johnson & Johnson (OTC)", "McDonald's (OTC)", "Microsoft (OTC)",
            "Pfizer (OTC)", "Tesla (OTC)"
        ];

        // Quotex Real Live Markets Array
        const realMarkets = [
            "EUR/USD", "GBP/USD", "USD/JPY", "AUD/USD", 
            "USD/CHF", "USD/CAD", "NZD/USD", "EUR/GBP", 
            "EUR/JPY", "GBP/JPY", "AUD/CAD", "CAD/JPY", 
            "CHF/JPY", "AUD/NZD", "AUD/CHF", "CAD/CHF", 
            "EUR/AUD", "EUR/CAD", "EUR/CHF", "EUR/NZD", 
            "GBP/AUD", "GBP/CAD", "GBP/CHF", "GBP/NZD", 
            "NZD/CAD", "NZD/CHF", "NZD/JPY", "USD/TRY", 
            "USD/ZAR", "USD/MXN", "USD/BRL", "USD/SGD",
            "EUR/SGD", "GBP/SGD", "AUD/SGD", "CAD/SGD",
            "GOLD", "SILVER", "UKBRENT", "USCRUDE",
            "Microsoft", "Apple", "Tesla", "Amazon",
            "Google", "Netflix", "Facebook", "Intel"
        ];

        let currentType = 'otc';

        // Render Markets based on Type
        function renderMarkets(type) {
            currentType = type;
            const marketListEl = document.getElementById('market-list');
            marketListEl.innerHTML = '';
            
            const datasets = type === 'otc' ? otcMarkets : realMarkets;

            datasets.forEach(market => {
                const label = document.createElement('label');
                label.className = 'market-card';
                // CHANGED to radio button here so user can only select one
                label.innerHTML = `
                    <input type="radio" name="marketSelection" value="${market}" class="market-checkbox">
                    <div class="card-content">
                        <span>${market}</span>
                        <svg class="check-icon" viewBox="0 0 24 24">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                `;
                marketListEl.appendChild(label);
            });
        }

        function switchMarketType(type) {
            document.getElementById('tab-otc').classList.remove('active');
            document.getElementById('tab-real').classList.remove('active');
            
            if(type === 'otc') {
                document.getElementById('tab-otc').classList.add('active');
            } else {
                document.getElementById('tab-real').classList.add('active');
            }
            renderMarkets(type);
        }

        // Initial Render
        renderMarkets('otc');

        // Handle Login & Show Notice Popup
        function handleLogin(e) {
            e.preventDefault();
            const licenseKey = document.getElementById('license-key').value;
            
            if(licenseKey === 'TORNADO-AI') {
                sessionStorage.setItem('isLoggedIn', 'true');
                
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'flex';
                document.getElementById('notice-modal').style.display = 'flex';
            } else {
                alert("Invalid License! Please enter a valid VIP License.");
            }
        }

        function closeNotice() {
            document.getElementById('notice-modal').style.display = 'none';
        }

        // Time Formatter
        function formatTime(date) {
            let hours = date.getHours();
            let minutes = date.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            return hours + ':' + minutes + ' ' + ampm;
        }

        // Main Generator Function (Updated for Single Selection Only)
        function generateSignals() {
            const selectedRadio = document.querySelector('.market-checkbox:checked');

            if (!selectedRadio) {
                alert("Please select a market.");
                return;
            }

            const market = selectedRadio.value;
            const now = new Date();
            document.getElementById('main-app').style.display = 'none';

            const targetTime = new Date(now.getTime() + 1 * 60000); 
            renderSingleSignal(market, formatTime(targetTime));
            document.getElementById('single-signal-page').style.display = 'flex';
        }

        // Render Single View
        function renderSingleSignal(market, timeStr) {
            const container = document.getElementById('single-signal-container');
            const isUp = Math.random() > 0.5;
            const directionClass = isUp ? 'single-up' : 'single-down';
            const logoClass = isUp ? 'large-logo-up' : 'large-logo-down';
            const iconId = isUp ? 'icon-up' : 'icon-down';
            const textDir = isUp ? 'CALL (UP)' : 'PUT (DOWN)';
            const colorClass = isUp ? 'text-up' : 'text-down';

            container.innerHTML = `
                <div class="single-signal-box ${directionClass}">
                    <div class="single-pair-title">${market}</div>
                    
                    <div class="large-logo-circle ${logoClass}">
                        <svg><use href="#${iconId}"></use></svg>
                    </div>
                    
                    <div class="single-direction-text ${colorClass}">${textDir}</div>
                    
                    <div class="single-details-grid">
                        <div class="detail-item">
                            <div class="detail-label">Entry Time</div>
                            <div class="detail-value">
                                <svg><use href="#icon-clock"></use></svg>
                                ${timeStr}
                            </div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Status</div>
                            <div class="detail-value" style="color: #e2e8f0;">Active</div>
                        </div>
                    </div>

                    <div class="single-trade-rule">
                        • If You Get A LOSS In The Last 5 Seconds, Then <span>(1STEP MTG IS MUST)</span>
                    </div>
                </div>
            `;
        }

        // Go Back Logic
        function goBack() {
            document.getElementById('single-signal-page').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
        }
    </script>
</body>
</html>
